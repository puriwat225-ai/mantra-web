<html lang="th">
<head>
    <meta charset="UTF-8">

    <title>MANTRA — Celestial Code 24 Cards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #7f77dd;
            --accent: #d4537e;
            --text-dark: #2c2c2a;
            --text-light: #888780;
            --surface-light: #f1efe8;
            --surface-white: #ffffff;
            --border-color: #d3d1c7;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text-dark: #e8e7e0;
                --text-light: #888780;
                --surface-light: #2c2c2a;
                --surface-white: #1a1a18;
                --border-color: #444441;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--surface-light);
            color: var(--text-dark);
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            background: var(--surface-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 0.5px solid var(--border-color);
            background: var(--surface-white);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .btn-back {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: var(--text-dark);
            padding: 0.5rem;
        }

        .btn-back:hover {
            opacity: 0.7;
        }

        .logo {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            color: var(--text-light);
        }

        .card-page {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .card-visual-container {
            width: 160px;
            height: 160px;
            background: var(--surface-white);
            border: 0.5px solid var(--border-color);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .card-title {
            text-align: center;
            margin-bottom: 1rem;
        }

        .card-number {
            font-size: 13px;
            color: var(--text-light);
            letter-spacing: 2px;
            margin-bottom: 0.25rem;
        }

        .card-name {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 0.75rem;
            color: var(--text-dark);
        }

        .world-badge {
            display: inline-block;
            background: var(--primary);
            color: white;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .world-badge.attract {
            background: #d85a30;
        }

        .world-badge.align {
            background: #1d9e75;
        }

        .world-badge.release {
            background: #5f5e5a;
        }

        .world-badge.rise {
            background: #185fa5;
        }

        .card-content {
            width: 100%;
            max-width: 380px;
        }

        .affirmation {
            font-size: 16px;
            font-weight: 500;
            text-align: center;
            line-height: 1.7;
            margin: 2rem 0 1.5rem;
            color: var(--text-dark);
            font-style: italic;
        }

        .core-message {
            font-size: 14px;
            color: var(--text-light);
            text-align: center;
            line-height: 1.7;
            margin-bottom: 2rem;
            padding: 1rem;
            background: var(--surface-white);
            border-radius: 8px;
            border-left: 3px solid var(--primary);
        }

        .section {
            margin-bottom: 0.5rem;
            background: var(--surface-white);
            border: 0.5px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }

        .section-header:hover {
            background: var(--surface-light);
        }

        .section-header.open {
            background: var(--surface-light);
        }

        .section-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .chevron {
            font-size: 12px;
            transition: transform 0.3s;
            opacity: 0.6;
        }

        .chevron.open {
            transform: rotate(180deg);
        }

        .section-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            background: var(--surface-white);
        }

        .section-content.open {
            max-height: 500px;
        }

        .section-text {
            padding: 1rem;
            font-size: 13px;
            color: var(--text-light);
            line-height: 1.7;
        }

        .buttons-group {
            display: flex;
            gap: 12px;
            margin-top: 2rem;
            width: 100%;
        }

        .btn {
            flex: 1;
            background: var(--surface-white);
            border: 0.5px solid var(--border-color);
            border-radius: 8px;
            padding: 0.875rem;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-dark);
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--surface-light);
            border-color: var(--text-light);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-next {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 2rem;
            transition: all 0.2s;
        }

        .btn-next:hover {
            background: #6f6fd4;
        }

        .btn-next:active {
            transform: scale(0.98);
        }

        .counter {
            font-size: 12px;
            color: var(--text-light);
            text-align: center;
            margin-top: 1rem;
        }

        .loading {
            text-align: center;
            color: var(--text-light);
            padding: 2rem;
        }
    </style>
</head>

        let currentCardIndex = 0;

        function renderCard() {
            const card = CARDS_DATA[currentCardIndex];
            const worldColor = {
                'ATTRACT': 'attract',
                'ALIGN': 'align',
                'RELEASE': 'release',
                'RISE': 'rise'
            };

            const html = `
                <div class="card-visual-container">
                    <img src="images/${card.image}" alt="${card.name}" class="card-image" onerror="this.alt='Card not found'">
                </div>

                <div class="card-title">
                    <div class="card-number">${card.number} — ${card.name.toUpperCase()}</div>
                    <div class="world-badge ${worldColor[card.world]}">${card.world}</div>
                </div>

                <div class="card-content">
                    <div class="affirmation">"${card.affirmation}"</div>
                    <div class="core-message">${card.core}</div>

                    <div class="section">
                        <div class="section-header" onclick="toggleSection(event)">
                            <span class="section-title">✨ TODAY'S RITUAL</span>
                            <span class="chevron">▼</span>
                        </div>
                        <div class="section-content">
                            <div class="section-text">${card.ritual}</div>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-header" onclick="toggleSection(event)">
                            <span class="section-title">▽ Shadow: สิ่งที่ควรระวัง</span>
                            <span class="chevron">▼</span>
                        </div>
                        <div class="section-content">
                            <div class="section-text">${card.shadow}</div>
                        </div>
                    </div>

                    <div class="buttons-group">
                        <button class="btn" onclick="shareCard()">📸 Share</button>
                        <button class="btn" onclick="saveCard()">💾 Save</button>
                    </div>

                    <button class="btn-next" onclick="nextCard()">Draw Next ↗</button>

                    <div class="counter">${currentCardIndex + 1} / ${CARDS_DATA.length}</div>
                </div>
            `;

            document.getElementById('cardPage').innerHTML = html;
        }

        function toggleSection(e) {
            const header = e.target.closest('.section-header');
            const content = header.nextElementSibling;
            const chevron = header.querySelector('.chevron');

            header.classList.toggle('open');
            content.classList.toggle('open');
        }

        function nextCard() {
            currentCardIndex = (currentCardIndex + 1) % CARDS_DATA.length;
            renderCard();
        }

        function shareCard() {
            const card = CARDS_DATA[currentCardIndex];
            const text = `${card.number} — ${card.name}\n"${card.affirmation}"\n\n${card.core}`;
            
            if (navigator.share) {
                navigator.share({
                    title: 'MANTRA Card',
                    text: text
                });
            } else {
                alert('Share not available on this browser');
            }
        }

        function saveCard() {
            const card = CARDS_DATA[currentCardIndex];
            const text = `${card.number} — ${card.name}\nAffirmation: "${card.affirmation}"\n\nCore Message:\n${card.core}`;
            
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `MANTRA-${card.number}-${card.name}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Load first card
        renderCard();
    </script>
</body>
